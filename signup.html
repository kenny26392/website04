<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | CyberKittoi</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-shell">
<a class="brand auth-brand" href="index.html">
<b>&gt;_</b>CYBER<span>KITTOI</span>
</a>
<section class="auth-card">
<h1>Create your account.</h1>
<p>Your cybersecurity learning journey starts here.</p>
<p class="notice">
</p>
<form class="demo-form">
<label for="name">Full name</label>
<input id="name" required placeholder="Your full name">
<label for="email">Email address</label>
<input id="email" type="email" required placeholder="you@example.com">
<label for="password">Password</label>
<input id="password" type="password" required placeholder="Choose a secure password">
<label for="confirm-password">Confirm password</label>
<input id="confirm-password" type="password" required placeholder="Repeat your password">
<button class="button primary">Create account →</button>
</form>
<p class="form-note">Already a learner? <a href="login.html">Log in</a>
</p>
</section>
</main>
<script src="script.js">
</script>
</body>
</html>
